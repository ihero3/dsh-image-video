# dsh-image-video bundle patch: 在 profile 根之上插入一行插件条目。
# 后续 bundle 层或用户 profile 的 cordis.patch.yml 可按 id 引用本行，
# 覆盖 config（如切换 provider、注入 API Key、调整默认尺寸/时长）。
#
# patch 替换目标行的整个 config 而非合并；如需多模式差异化，请在各模式
# bundle 中重述完整 config。本文件仅声明插件入口与默认配置，不内联凭证。
#
# 服务依赖：
#   - tools（必需）：工具注册表，由 dsh-base 提供。
#   - attachments（generate_image 必需）：attachment 服务，由 dsh-base 的
#     attachment-local 行提供。generate_image 通过 ctx.inject 声明依赖，
#     服务未挂载时 generate_image 不注册；generate_video 不依赖此服务。
# 本插件用 - insert 新增 image-video 行，不覆盖任何现有插件行。

- insert:
    - id: image-video
      name: 'dsh-image-video'
      config:
        # 激活的生成服务商，threevideo（默认，图片+视频） | wanx | seedance
        provider: threevideo
        # Threevideo 凭证；provider=threevideo 时使用（图片+视频统一入口）
        # apiKeyEnv 指向上游登录写入的凭证引用：不内联明文，登录/填 Key 后即生效。
        # 缺这一行时插件读不到凭证缝里的 Key，生成与模型目录探测都会报「未配置 API Key」。
        threevideo:
          apiKey: ''
          apiKeyEnv: THREEVIDEO_API_KEY
          baseURL: ''
        # 万象（阿里云百炼）凭证；provider=wanx 时使用
        wanx:
          apiKey: ''
          baseURL: ''
        # MiniMax 官方平台凭证；provider=minimax 时使用
        minimax:
          apiKey: ''
          baseURL: ''
        # Seedance2.5（火山引擎）凭证；provider=seedance 时使用
        seedance:
          apiKey: ''
          baseURL: ''
        # 默认图片服务商；留空跟随激活服务商（threevideo | wanx | seedance）
        defaultImageProvider: ''
        # 默认视频服务商；留空跟随激活服务商（threevideo | wanx | seedance）
        defaultVideoProvider: ''
        # 默认图片尺寸（百炼接口要求 * 分隔，如 1024*1024）
        defaultImageSize: '1024*1024'
        # 默认视频时长（秒），上限 30，由上游模型校验具体能力
        defaultVideoDuration: 5
        # 单次 HTTP 请求超时（毫秒）
        timeoutMs: 60000
        # 视频任务轮询间隔（毫秒）
        pollIntervalMs: 5000
        # 视频任务整体超时（毫秒），超时后中止轮询
        pollTimeoutMs: 600000
        # 可重试错误的最大重试次数
        retryTimes: 3
        # 图片提交传输：auto 优先异步；异步端点未启用时安全降级同步
        imageTransport: auto
        # 提交状态未知时默认失败，不盲目再次生成；可选 resubmit-same-key
        imageUnknownStatePolicy: fail
        # 生成媒体落地目录（相对路径基于进程 cwd 解析）
        outputsDir: './outputs'
        # 语音（TTS）：同步合成 / 语音克隆 / 长文本异步。
        # apiKey/apiKeyEnv/baseURL 全空时**回落上面 threevideo 的凭证与端点**
        # （语音与生图/生视频同一个网关账号，用户不必配两遍 Key）。
        tts:
          provider: threevideo
          apiKey: ''
          apiKeyEnv: THREEVIDEO_TTS_API_KEY
          # 留空跟随激活服务商的 baseURL；语音路由只在另一站点部署时可单独指过去
          baseURL: ''
          # 同步合成模型，留空用内置默认（qwen-audio-3.1-tts-flash）
          model: ''
          # 默认音色，留空按模型兜底；可填预设音色或复刻音色（mmxvc_…）
          defaultVoice: ''
          # 预设音色清单（复刻音色由宿主持久化到工作台数据目录）
          voices: []
          # 同步合成的音频封装
          responseFormat: mp3
          # 语音克隆模型，留空用内置默认（speech-2.8-hd）
          cloneModel: ''
          # 默认语气指令，如「用温柔的语气，语速稍慢」
          instruction: ''
          # 超过该字数时工具自动改走长文本异步端点（0 = 从不自动切换）
          asyncThresholdChars: 800
        # 最终图片水印：与模型结果使用同一 outputsDir 和 attachment 流程
        watermark:
          enabled: true
          text: 'Threevideo'
          opacity: 0.68
          position: bottom-right
          fontSizeRatio: 0.032
          marginXRatio: 0.028
          marginYRatio: 0.012
          glowEnabled: true
          glowColor: '#ffffff'
          glowBlurRatio: 0.18
